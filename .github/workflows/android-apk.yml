name: Android debug APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Point Gradle at the runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Use GitHub secret keystore when set
        env:
          RITE_DEBUG_KEYSTORE_BASE64: ${{ secrets.RITE_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${RITE_DEBUG_KEYSTORE_BASE64}" ]]; then
            echo "${RITE_DEBUG_KEYSTORE_BASE64}" | base64 -d > native/rite-debug.keystore
            echo "Loaded keystore from secret RITE_DEBUG_KEYSTORE_BASE64"
          else
            echo "Using committed native/rite-debug.keystore"
          fi
          keytool -list -v -keystore native/rite-debug.keystore -storepass android -alias rite | grep SHA256
      - run: npm run native:web
      - run: npx cap add android
      - run: npx cap sync android
      - run: node native/inject-lock.mjs
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/Rite-debug.apk
      - name: Re-sign with the pinned keystore
        run: |
          SIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$SIGNER" sign \
            --ks native/rite-debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias rite \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            dist-apk/Rite-debug.apk
          "$SIGNER" verify --print-certs dist-apk/Rite-debug.apk
      - name: Pin signing SHA-256
        run: node native/verify-apk-cert.mjs dist-apk/Rite-debug.apk
      - uses: actions/upload-artifact@v6
        with:
          name: rite-debug-apk
          path: dist-apk/Rite-debug.apk
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.1.0"
          fi
          gh release create "${TAG}" dist-apk/Rite-debug.apk \
            --title "Rite ${TAG}" \
            --notes "Rite v0.1.0 — first public APK. Pinned signing key (SHA-256 C79734F4…4B0C). Uninstall any older Rite build first; those used a different key. Empty first launch, encrypted backup, dated tasks, study pin." \
            --latest \
            || gh release upload "${TAG}" dist-apk/Rite-debug.apk --clobber
